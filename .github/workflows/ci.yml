name: FolioLoom CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: folioloom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: folioloom/package-lock.json
      - run: npm ci
      - run: npm run desktop:build
      - run: npm test
      - run: npm run typecheck
